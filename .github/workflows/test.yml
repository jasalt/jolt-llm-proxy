---
name: test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jolt-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          persist-credentials: false
      - name: Install Jolt
        run: |
          version=0.8.7
          archive=jolt-v${version}-x86_64-linux.tar.gz
          release=https://github.com/jolt-lang/jolt/releases/download/v${version}
          curl -fsSL "$release/$archive" -o "$archive"
          echo "fec4b404ed1118074e04688d8277967dd66dd2f3fdd3365bb22330908215c944  $archive" | sha256sum -c -
          mkdir jolt-dist
          tar -xzf "$archive" -C jolt-dist
          jolt_bin=$(find jolt-dist -type f -name jolt -perm -u+x -print -quit)
          test -n "$jolt_bin"
          sudo install "$jolt_bin" /usr/local/bin/jolt
          jolt --version
      - name: Load production namespaces
        run: >-
          jolt -e '(doseq [n (quote [ebb.core glimmer.ratom jolt.datastar.core
          llm-proxy.core llm-proxy.dashboard llm-proxy.flow llm-proxy.id
          llm-proxy.inspect llm-proxy.proxy llm-proxy.schema
          llm-proxy.transport.sse llm-proxy.transport.ws
          codex.auth codex.cli codex.collect codex.continuation codex.translate
          codex.ws])] (require n))'
      - name: Run unit tests
        run: jolt -M:test -m llm-proxy.test-runner
